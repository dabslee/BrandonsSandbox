<div class="projectcontrols">

                <div class="projectcontrols-row" id="project-view">
                    <button type="button" class="tag" data-view="category">By Category</button>
                    <button type="button" class="tag" data-view="ungrouped">Ungrouped</button>
                </div>
            </div>
        </div>
        <div class="projectdropdown">
            <button type="button" id="project-dropdown-toggle" class="button projectdropdown-toggle" aria-expanded="false" aria-controls="project-dropdown-menu">Sort/Filter <i class="bi bi-filter"></i></button>
            <div id="project-dropdown-menu" class="projectdropdown-menu" hidden>
                <p><b>Sort by:</b></p>
                <div class="projectcontrols-row" id="project-sort">
                    <button type="button" class="tag" data-sort="new">Newest</button>
                    <button type="button" class="tag" data-sort="old">Oldest</button>
                    <button type="button" class="tag" data-sort="az">A to Z</button>
                    <button type="button" class="tag" data-sort="za">Z to A</button>
                </div>
                <p><b>Available links:</b></p>
                <div class="projectcontrols-row" id="project-link-filters">
                    <button type="button" class="tag" data-link="Code">Code</button>
                    <button type="button" class="tag" data-link="Demo">Demo</button>
                    <button type="button" class="tag" data-link="Install">Install</button>
                </div>
                <p><b>Filter by tag:</b></p>
                <div class="projectcontrols-row" id="project-tag-filters"></div>
            </div>
        </div>
    </div>
    <p id="project-empty" hidden>No projects match these filters.</p>
</div>

<script>
(function () {
    const PROJECTS = JSON.parse(document.getElementById("projects-data").textContent);
    const CATEGORIES = ["game", "webapp", "mobile", "simulation", "data visualization", "algorithms"];
    const container = document.querySelector(".projectcontainer");
    const el = (tag, props = {}, children = []) => {
        const node = Object.assign(document.createElement(tag), props);
        node.append(...children);
        return node;
    };
    const linkButton = (label, href, newTab = true) => href
        ? el("a", {href, className: "button", textContent: label, ...(newTab && {target: "_blank"})})
        : el("div", {className: "deadbutton", textContent: label});
    PROJECTS.forEach(p => {
        const [year, month] = p.date.split("-").map(Number);
        const block = el("div", {className: "projectblock"}, [
            el("h2", {textContent: p.name}),
            el("img", {src: p.image, className: "projectimagebox"}),
            el("div", {className: "buttonholder"}, [
                linkButton("Code", p.code),
                linkButton("Demo", p.demo),
                ...(p.install ? [linkButton("Install", p.install, false)] : []),
            ]),
            el("p", {innerHTML: p.description}),
            el("div", {className: "projectfooter"}, [
                el("p", {className: "projectdate",
                    textContent: new Date(year, month - 1).toLocaleString("en-US", {month: "long", year: "numeric"})}),
                el("div", {className: "tagholder"}, p.tags.map(t =>
                    el("span", {className: "tag" + (CATEGORIES.includes(t) ? " tag-category" : ""), textContent: t}))),
            ]),
        ]);
        Object.assign(block.dataset, {name: p.name, date: p.date, tags: p.tags.join("|")});
        container.appendChild(block);
    });

    const blocks = Array.from(container.querySelectorAll(".projectblock"));
    const search = document.getElementById("project-search");
    const sortButtons = Array.from(document.querySelectorAll("#project-sort .tag"));
    const filterRow = document.getElementById("project-tag-filters");
    const empty = document.getElementById("project-empty");
    const toggle = document.getElementById("project-dropdown-toggle");
    const linkButtons = Array.from(document.querySelectorAll("#project-link-filters .tag"));
    const viewButtons = Array.from(document.querySelectorAll("#project-view .tag"));
    const categoryView = document.querySelector(".categoryview");
    const selected = new Set();
    const selectedLinks = new Set();
    let sortBy = "new";
    let viewMode = "category";

    const info = new Map(blocks.map(b => {
        const desc = b.querySelector(":scope > p");
        const links = Array.from(b.querySelectorAll(".buttonholder a.button"), a => a.textContent.trim());
        return [b, {
            text: (b.dataset.name + " " + (desc ? desc.textContent : "")).replace(/\s+/g, " ").toLowerCase(),
            links: new Set(links),
        }];
    }));

    const dropdowns = Array.from(document.querySelectorAll(".projectdropdown"), d => ({
        toggle: d.querySelector(".projectdropdown-toggle"),
        menu: d.querySelector(".projectdropdown-menu"),
    }));
    function setMenuOpen(dropdown, open) {
        dropdown.menu.hidden = !open;
        dropdown.toggle.setAttribute("aria-expanded", open);
    }
    dropdowns.forEach(dropdown => dropdown.toggle.addEventListener("click", () => {
        const open = dropdown.menu.hidden;
        dropdowns.forEach(d => setMenuOpen(d, false));
        setMenuOpen(dropdown, open);
    }));
    document.addEventListener("click", e => {
        if (!e.target.closest(".projectdropdown")) dropdowns.forEach(d => setMenuOpen(d, false));
    });
    document.addEventListener("keydown", e => {
        const open = dropdowns.find(d => !d.menu.hidden);
        if (e.key === "Escape" && open) { setMenuOpen(open, false); open.toggle.focus(); }
    });

    sortButtons.forEach(btn => btn.addEventListener("click", () => {
        sortBy = btn.dataset.sort;
        update();
    }));

    viewButtons.forEach(btn => btn.addEventListener("click", () => {
        viewMode = btn.dataset.view;
        dropdowns.forEach(d => setMenuOpen(d, false));
        update();
    }));

    linkButtons.forEach(btn => btn.addEventListener("click", () => {
        const link = btn.dataset.link;
        selectedLinks.has(link) ? selectedLinks.delete(link) : selectedLinks.add(link);
        update();
    }));

    const allTags = new Set(blocks.flatMap(b => b.dataset.tags.split("|")));
    const others = [...allTags].filter(t => !CATEGORIES.includes(t))
        .sort((a, b) => a.localeCompare(b, undefined, {sensitivity: "base"}));
    const tagButtons = {};
    [...CATEGORIES.filter(t => allTags.has(t)), ...others].forEach(tag => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "tag" + (CATEGORIES.includes(tag) ? " tag-category" : "");
        btn.textContent = tag;
        btn.addEventListener("click", () => toggleTag(tag));
        filterRow.appendChild(btn);
        tagButtons[tag] = btn;
    });
    function makeClearButton(row, set) {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "tag clear-selection";
        btn.innerHTML = 'clear <span class="clear-x" aria-hidden="true">&times;</span>';
        btn.hidden = true;
        btn.addEventListener("click", () => { set.clear(); update(); });
        row.appendChild(btn);
        return btn;
    }
    const clearTags = makeClearButton(filterRow, selected);
    const clearLinks = makeClearButton(document.getElementById("project-link-filters"), selectedLinks);

    document.addEventListener("click", e => {
        const chip = e.target.closest(".tagholder .tag");
        if (chip) toggleTag(chip.textContent.trim());
    });

    const MIN_CATEGORY_SIZE = 3;
    const CATEGORY_TITLES = {
        "game": "games",
        "webapp": "webapps",
        "simulation": "simulations",
        "data visualization": "data visualizations",
    };
    const CATEGORY_PRIORITY = ["game", "data visualization", "simulation", "algorithms", "mobile", "webapp"];
    function renderCategoryView(sortedBlocks) {
        const visibleBlocks = sortedBlocks.filter(b => !b.hidden);
        const tagsOf = b => b.dataset.tags.split("|");
        const allowed = [...CATEGORY_PRIORITY];
        const assign = () => new Map(visibleBlocks.map(b =>
            [b, allowed.find(category => tagsOf(b).includes(category)) || "other"]));
        let assigned = assign();
        for (const category of CATEGORY_PRIORITY) {
            const count = visibleBlocks.filter(b => assigned.get(b) === category).length;
            if (count >= MIN_CATEGORY_SIZE) continue;
            allowed.splice(allowed.indexOf(category), 1);
            assigned = assign();
        }
        const rows = [...allowed, "other"]
            .map(category => ({category, members: visibleBlocks.filter(b => assigned.get(b) === category)}))
            .sort((a, b) => (a.category === "other") - (b.category === "other") || b.members.length - a.members.length);

        categoryView.replaceChildren();
        rows.filter(row => row.members.length).forEach(({category, members}) => {
            const label = el("div", {className: "categorylabel"}, [
                el("h2", {textContent: CATEGORY_TITLES[category] || category}),
                el("p", {className: "categorylabel-count",
                    textContent: `${members.length} project${members.length === 1 ? "" : "s"}`}),
            ]);
            const cards = members.map(b => b.cloneNode(true));
            cards.forEach((card, i) => card.style.zIndex = cards.length - i);
            const stack = el("div", {className: "cardstack"}, [el("div", {className: "cardstack-track"}, cards)]);
            const row = el("section", {className: "categoryrow", ariaLabel: category}, [label, stack]);
            row.dataset.category = category;
            categoryView.appendChild(row);

            stack.addEventListener("mouseover", e => {
                const card = e.target.closest(".projectblock");
                if (card) layoutStack(stack, cards.indexOf(card));
            });
            stack.addEventListener("mouseleave", () => layoutStack(stack, -1));
            stack.addEventListener("focusin", e => layoutStack(stack, cards.indexOf(e.target.closest(".projectblock"))));
            stack.addEventListener("focusout", e => {
                if (!stack.contains(e.relatedTarget)) layoutStack(stack, -1);
            });
            layoutStack(stack, -1);
        });
    }

    const CARD_GAP = 16, MIN_CARD_STEP = 32;
    function layoutStack(stack, focusIndex) {
        stack.focusIndex = focusIndex;
        const track = stack.firstElementChild;
        const cards = Array.from(track.children);
        const widths = cards.map(card => card.offsetWidth);
        const style = getComputedStyle(stack);
        const width = stack.clientWidth - (parseFloat(style.paddingLeft) || 0) - (parseFloat(style.paddingRight) || 0);

        const fullSteps = widths.slice(0, -1).map(w => w + CARD_GAP);
        const focused = focusIndex > 0;
        const flexible = fullSteps.map((_, i) => !(focused && i + 1 === focusIndex));
        let space = width - widths[widths.length - 1];
        fullSteps.forEach((full, i) => { if (!flexible[i]) space -= full; });
        const caps = fullSteps.filter((_, i) => flexible[i]).sort((a, b) => a - b);
        let level = Infinity, remaining = space, count = caps.length;
        for (const cap of caps) {
            if (cap * count <= remaining) { remaining -= cap; count--; }
            else { level = remaining / count; break; }
        }
        const steps = fullSteps.map((full, i) =>
            flexible[i] ? Math.max(MIN_CARD_STEP, Math.min(full, level)) : full);

        let x = 0;
        cards.forEach((card, i) => {
            if (i > 0) x += steps[i - 1];
            card.style.transform = `translateX(${x}px)`;
        });
        track.style.width = `${x + widths[widths.length - 1]}px`;
        track.style.height = `${Math.max(...cards.map(card => card.offsetHeight))}px`;
    }

    new ResizeObserver(() => {
        categoryView.querySelectorAll(".cardstack").forEach(stack => layoutStack(stack, stack.focusIndex));
    }).observe(categoryView);

    function toggleTag(tag) {
        selected.has(tag) ? selected.delete(tag) : selected.add(tag);
        update();
    }

    const MOVE_DURATION = 400, FADE_DURATION = 300;
    let renderedViewMode = null;

    function visibleCards() {
        return viewMode === "category"
            ? Array.from(categoryView.querySelectorAll(".projectblock"))
            : blocks.filter(b => !b.hidden);
    }
    const cardKey = card => (card.closest(".categoryrow")?.dataset.category || "") + "|" + card.dataset.name;

    function snapshotCards() {
        return new Map(visibleCards().map(card => [cardKey(card), {card, rect: card.getBoundingClientRect()}]));
    }

    function animateCards(before) {
        const shown = new Set();
        visibleCards().forEach(card => {
            const key = cardKey(card);
            shown.add(key);
            const final = card.style.transform || "translate(0px, 0px)";
            const old = before.get(key);
            if (old) {
                const rect = card.getBoundingClientRect();
                const dx = old.rect.left - rect.left, dy = old.rect.top - rect.top;
                if (dx || dy) card.animate(
                    [{transform: `translate(${dx}px, ${dy}px) ${final}`}, {transform: final}],
                    {duration: MOVE_DURATION, easing: "ease"});
            } else {
                card.animate(
                    [{opacity: 0, transform: `${final} scale(0.95)`}, {opacity: 1, transform: final}],
                    {duration: MOVE_DURATION, easing: "ease"});
            }
        });
        before.forEach(({card, rect}, key) => {
            if (shown.has(key)) return;
            const ghost = card.cloneNode(true);
            ghost.hidden = false;
            Object.assign(ghost.style, {
                position: "fixed", left: `${rect.left}px`, top: `${rect.top}px`,
                margin: "0", transform: "none", zIndex: "1", pointerEvents: "none",
            });
            document.body.appendChild(ghost);
            ghost.animate(
                [{opacity: 1, transform: "scale(1)"}, {opacity: 0, transform: "scale(0.95)"}],
                {duration: FADE_DURATION, easing: "ease"}
            ).onfinish = () => ghost.remove();
        });
    }

    function update() {
        const animate = renderedViewMode === viewMode
            && typeof Element.prototype.animate === "function";
        const before = animate ? snapshotCards() : null;

        const query = search.value.trim().toLowerCase();
        let visible = 0;
        blocks.forEach(b => {
            const tags = b.dataset.tags.split("|");
            const {text, links} = info.get(b);
            const show = text.includes(query)
                && [...selected].every(t => tags.includes(t))
                && [...selectedLinks].every(l => links.has(l));
            b.hidden = !show;
            if (show) visible++;
        });
        Object.entries(tagButtons).forEach(([tag, btn]) =>
            btn.classList.toggle("tag-selected", selected.has(tag)));
        container.querySelectorAll(".tagholder .tag").forEach(chip =>
            chip.classList.toggle("tag-selected", selected.has(chip.textContent.trim())));
        sortButtons.forEach(btn =>
            btn.classList.toggle("tag-selected", btn.dataset.sort === sortBy));
        linkButtons.forEach(btn =>
            btn.classList.toggle("tag-selected", selectedLinks.has(btn.dataset.link)));
        viewButtons.forEach(btn =>
            btn.classList.toggle("tag-selected", btn.dataset.view === viewMode));
        const filterCount = selected.size + selectedLinks.size;
        clearTags.hidden = selected.size === 0;
        clearLinks.hidden = selectedLinks.size === 0;
        empty.hidden = visible > 0;
        toggle.innerHTML = "Sort/Filter" + (filterCount ? ` (${filterCount})` : "") + ' <i class="bi bi-filter"></i>';

        const byName = (a, b) => a.dataset.name.localeCompare(b.dataset.name, undefined, {sensitivity: "base"});
        const byDate = (a, b) => a.dataset.date.localeCompare(b.dataset.date);
        const sorters = {
            new: (a, b) => byDate(b, a) || byName(a, b),
            old: (a, b) => byDate(a, b) || byName(a, b),
            az: byName,
            za: (a, b) => byName(b, a),
        };
        const sorted = blocks.slice().sort(sorters[sortBy]);
        sorted.forEach(b => container.appendChild(b));

        const byCategory = viewMode === "category";
        container.hidden = byCategory;
        categoryView.hidden = !byCategory;
        if (byCategory) renderCategoryView(sorted);
        else categoryView.replaceChildren();

        if (before) animateCards(before);
        renderedViewMode = viewMode;
    }

    search.addEventListener("input", update);
    update();
})();
</script>
{% endblock %}
